name: Importaizer PHP lint

on:
  push:
    paths:
      - 'app/public/wp-content/plugins/importaizer/**/*.php'
  pull_request:
    paths:
      - 'app/public/wp-content/plugins/importaizer/**/*.php'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Lint Importaizer PHP files
        shell: bash
        run: |
          set -e
          find app/public/wp-content/plugins/importaizer -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
